<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bersihinkost — Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lavender: {50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',300:'#c4b5fd',400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',800:'#5b21b6',900:'#4c1d95'},
                        peach: {50:'#fff1f2',100:'#ffe4e6',200:'#fecdd3',300:'#fda4af',400:'#fb7185',500:'#f43f5e',600:'#e11d48',700:'#be123c'},
                        base: '#F9F8FC'
                    },
                    fontFamily: { sans: ['Nunito','sans-serif'] },
                    boxShadow: { 'float': '0 20px 40px -15px rgba(124, 58, 237, 0.15)', 'card': '0 10px 30px -10px rgba(0, 0, 0, 0.05)' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        html { -webkit-text-size-adjust: 100%; }
        body { font-family:'Nunito',sans-serif; background-color:#F9F8FC; color:#2D3748; overflow-x:hidden; }
        img, video, canvas, svg { max-width:100%; height:auto; }
        img { display:block; }
        input, select, textarea { font-size:14px; }
        @media (max-width: 640px) {
            input, select, textarea { font-size:16px; }
            button, a { -webkit-tap-highlight-color: transparent; }
        }
        .scrollbar-hide { -ms-overflow-style:none; scrollbar-width:none; }
        .scrollbar-hide::-webkit-scrollbar { display:none; }
        .break-anywhere { overflow-wrap:anywhere; word-break:break-word; }
        .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
        .table-scroll table { min-width:640px; }
        @media print {
            body { background:#fff; }
            @page { margin: 12mm; }
            body.printing #app { display:none !important; }
            body.printing #printRoot { display:block !important; }
            #pdfRoot { display:none !important; }
        }
        ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#ddd6fe;border-radius:999px}::-webkit-scrollbar-thumb:hover{background:#a78bfa}
        #app { display: contents; }
        .demo-chip { position:fixed; z-index:60; right:10px; bottom:10px; font-size:10px; }
    </style>
</head>
<body class="min-h-screen selection:bg-peach-400 selection:text-white">

<div id="app"></div>

<!-- Offscreen root untuk generate PDF (html2canvas butuh element ter-render) -->
<div id="pdfRoot" style="position:fixed; left:-10000px; top:0; width:794px; background:#fff;"></div>

<!-- Root cetak (print dialog) -->
<div id="printRoot" class="hidden print:block"></div>

<!-- Toast -->
<div id="toastWrap" class="fixed top-4 left-1/2 -translate-x-1/2 z-[200] w-[92%] max-w-md space-y-2 pointer-events-none"></div>

<!-- Modal Konfirmasi Global -->
<div id="confirmModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] shadow-float w-full max-w-sm p-6 border border-lavender-50 text-center">
        <div id="confirmIconWrap" class="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-xl mb-3 bg-lavender-50 text-lavender-600">
            <i id="confirmIcon" class="fa-solid fa-circle-question"></i>
        </div>
        <h3 id="confirmTitle" class="text-lg font-extrabold text-gray-800">Yakin?</h3>
        <p id="confirmMessage" class="text-xs font-semibold text-gray-500 mt-1 mb-5">Tindakan ini tidak dapat dibatalkan.</p>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="UI.closeConfirm()" class="py-3 rounded-2xl bg-gray-100 text-gray-600 font-extrabold text-sm hover:bg-gray-200 transition-colors">Batal</button>
            <button id="confirmYesBtn" onclick="UI.submitConfirm()" class="py-3 rounded-2xl bg-lavender-600 text-white font-extrabold text-sm shadow-md hover:bg-lavender-700 transition-all">Ya</button>
        </div>
    </div>
</div>

<span class="demo-chip hidden sm:inline-flex items-center gap-1.5 bg-white/90 backdrop-blur border border-lavender-100 text-lavender-600 font-extrabold px-3 py-1.5 rounded-full shadow-card">
    <i class="fa-solid fa-flask"></i> MODE DEMO · data tersimpan di localStorage browser ini
</span>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/admin-layout.js"></script>
<script src="js/public.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-dashboard.js"></script>
<script src="js/admin-orders.js"></script>
<script src="js/admin-services.js"></script>
<script src="js/admin-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
